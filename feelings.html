<!DOCTYPE html>
<html>
<head>
    <title>HINGA - How Are You Feeling?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f3f8f5;
            margin: 0;
            padding: 30px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        h1 {
            font-size: 36px;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
        }

        button {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
        }

        #message {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background: white;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💙 How Are You Feeling?</h1>

    <p>
        There is no wrong answer. Choose what feels closest to you right now.
    </p>

    <button onclick="showMessage('happy')">😊 Happy</button>
    <button onclick="showMessage('okay')">😐 Okay</button>
    <button onclick="showMessage('worried')">😟 Worried</button>
    <button onclick="showMessage('sad')">😢 Sad</button>
    <button onclick="showMessage('overwhelmed')">😣 Overwhelmed</button>
    <button onclick="showMessage('angry')">😡 Angry</button>

    <div id="message"></div>

</div>

<script>
function showMessage(feeling) {

    let message = document.getElementById("message");

    if (feeling === "happy") {
        message.innerHTML =
        "😊 It's nice that you're feeling happy. Take a moment to enjoy it and remember what helped you feel this way.";
    }

    if (feeling === "okay") {
        message.innerHTML =
        "😐 It's okay to simply feel okay. You don't have to feel happy all the time.";
    }

    if (feeling === "worried") {
        message.innerHTML =
        "😟 Take a slow breath. Try focusing on one thing you can handle right now instead of everything at once.";
    }

    if (feeling === "sad") {
        message.innerHTML =
        "😢 It's okay to acknowledge sadness. Consider talking to someone you trust and giving yourself some time to rest.";
    }

    if (feeling === "overwhelmed") {
        message.innerHTML =
        "😣 Pause for a moment. Put your tasks aside briefly, take a few slow breaths, and choose just one small thing to do next.";
    }

    if (feeling === "angry") {
        message.innerHTML =
        "😡 Give yourself some space before reacting. Take slow breaths and try to understand what caused the feeling.";
    }

    message.style.display = "block";
}
</script>

</body>
</html>
